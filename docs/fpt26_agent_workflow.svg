<svg xmlns="http://www.w3.org/2000/svg" width="4200" height="760" viewBox="0 0 4200 760" role="img" aria-labelledby="title desc">
  <title id="title">FPT26 Agent workflow</title>
  <desc id="desc">Dark horizontal workflow diagram for the FPT26 Agent, showing official task loading, baseline HLS, repair or optimization candidates, official score, and report artifacts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8f8f8f"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .bg { fill: #181818; }
      .band { fill: #202020; opacity: 0.9; }
      .node { fill: #303030; stroke: #424242; stroke-width: 1.2; filter: url(#softShadow); }
      .node-hi { fill: #353535; stroke: #4f4f4f; stroke-width: 1.2; filter: url(#softShadow); }
      .decision { fill: #343434; stroke: #4a4a4a; stroke-width: 1.2; filter: url(#softShadow); }
      .artifact { fill: #292929; stroke: #4d4d4d; stroke-width: 1.2; stroke-dasharray: 8 7; }
      .arrow { fill: none; stroke: #858585; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-soft { fill: none; stroke: #686868; stroke-width: 1.9; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #777777; stroke-width: 2; marker-end: url(#arrow); }
      .label { fill: #e7e7e7; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 24px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
      .sub { fill: #b9b9b9; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 500; text-anchor: middle; dominant-baseline: middle; }
      .tiny { fill: #a8a8a8; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 16px; font-weight: 500; text-anchor: middle; dominant-baseline: middle; }
      .tag { fill: #f2f2f2; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .dot { fill: #eeeeee; stroke: #202020; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="4200" height="760"/>
  <rect class="band" x="0" y="286" width="4200" height="124"/>

  <text class="label" x="2100" y="54">FPT26 Agent workflow with official Harness scoring and report artifacts</text>
  <text class="sub" x="2100" y="88">All HLS execution goes through official Task + ToolServer; official hidden grading is only run when --score is enabled.</text>

  <!-- main entry path -->
  <rect class="node" x="40" y="306" width="180" height="74"/>
  <text class="label" x="130" y="336">Official</text>
  <text class="sub" x="130" y="362">task package</text>

  <rect class="node" x="270" y="306" width="210" height="74"/>
  <text class="label" x="375" y="336">python -m</text>
  <text class="sub" x="375" y="362">agent.main CLI</text>

  <rect class="node" x="530" y="286" width="250" height="114"/>
  <text class="label" x="655" y="322">TaskAdapter</text>
  <text class="sub" x="655" y="350">TaskContext</text>
  <text class="tiny" x="655" y="376">HLS IR V2</text>

  <rect class="node-hi" x="830" y="286" width="300" height="114"/>
  <text class="label" x="980" y="318">Baseline HLS</text>
  <text class="sub" x="980" y="348">CSim + Synth</text>
  <text class="tiny" x="980" y="374">optional CoSim</text>

  <polygon class="decision" points="1260,244 1360,344 1260,444 1160,344"/>
  <text class="label" x="1260" y="326">Initial</text>
  <text class="sub" x="1260" y="354">condition?</text>

  <polygon class="decision" points="1540,244 1640,344 1540,444 1440,344"/>
  <text class="label" x="1540" y="326">Mode</text>
  <text class="sub" x="1540" y="354">route gate</text>

  <path class="arrow" d="M 220 343 L 270 343"/>
  <path class="arrow" d="M 480 343 L 530 343"/>
  <path class="arrow" d="M 780 343 L 830 343"/>
  <path class="arrow" d="M 1130 343 L 1160 343"/>
  <path class="arrow" d="M 1360 343 L 1440 343"/>

  <!-- controller branches -->
  <rect class="node" x="1710" y="104" width="290" height="86"/>
  <text class="label" x="1855" y="136">Open-source LLM</text>
  <text class="sub" x="1855" y="164">repair JSON + tokens</text>

  <rect class="node" x="1710" y="300" width="290" height="86"/>
  <text class="label" x="1855" y="330">Report-driven</text>
  <text class="sub" x="1855" y="358">PPA transforms</text>

  <rect class="node" x="1710" y="496" width="290" height="86"/>
  <text class="label" x="1855" y="526">CoSim diagnostics</text>
  <text class="sub" x="1855" y="554">structural repair</text>

  <rect class="node-hi" x="2070" y="300" width="280" height="86"/>
  <text class="label" x="2210" y="330">Free guards</text>
  <text class="sub" x="2210" y="358">KernelValidator</text>

  <rect class="node" x="2420" y="300" width="230" height="86"/>
  <text class="label" x="2535" y="330">Candidate</text>
  <text class="sub" x="2535" y="358">CSim</text>

  <rect class="node" x="2720" y="300" width="230" height="86"/>
  <text class="label" x="2835" y="330">Candidate</text>
  <text class="sub" x="2835" y="358">Synth</text>

  <rect class="node" x="2720" y="496" width="230" height="86"/>
  <text class="label" x="2835" y="526">Candidate</text>
  <text class="sub" x="2835" y="554">CoSim</text>

  <polygon class="decision" points="3150,238 3258,346 3150,454 3042,346"/>
  <text class="label" x="3150" y="318">Quality</text>
  <text class="sub" x="3150" y="346">improves?</text>
  <text class="tiny" x="3150" y="374">score / latency</text>

  <rect class="node" x="3385" y="244" width="190" height="70"/>
  <text class="label" x="3480" y="278">Update best</text>

  <rect class="node" x="3385" y="384" width="190" height="70"/>
  <text class="label" x="3480" y="418">Keep best</text>

  <polygon class="decision" points="3730,238 3838,346 3730,454 3622,346"/>
  <text class="label" x="3730" y="318">Budget</text>
  <text class="sub" x="3730" y="346">round gate</text>

  <rect class="node-hi" x="3910" y="306" width="210" height="74"/>
  <text class="label" x="4015" y="336">Final verify</text>
  <text class="sub" x="4015" y="362">selected kernel</text>

  <path class="arrow-soft" d="M 1640 344 C 1682 344 1680 148 1710 148"/>
  <path class="arrow-soft" d="M 1640 344 L 1710 344"/>
  <path class="arrow-soft" d="M 1640 344 C 1682 344 1680 540 1710 540"/>
  <path class="arrow" d="M 2000 148 C 2038 148 2030 306 2070 326"/>
  <path class="arrow" d="M 2000 344 L 2070 344"/>
  <path class="arrow" d="M 2000 540 C 2040 540 2030 380 2070 362"/>
  <path class="arrow" d="M 2350 343 L 2420 343"/>
  <path class="arrow" d="M 2650 343 L 2720 343"/>
  <path class="arrow" d="M 2950 343 L 3042 343"/>
  <path class="arrow-soft" d="M 2835 386 L 2835 496"/>
  <path class="arrow-soft" d="M 2950 540 C 3015 540 3005 386 3042 364"/>
  <path class="arrow" d="M 3258 324 L 3385 278"/>
  <path class="arrow" d="M 3258 368 L 3385 418"/>
  <path class="arrow" d="M 3575 278 C 3602 278 3602 318 3622 326"/>
  <path class="arrow" d="M 3575 418 C 3602 418 3602 374 3622 366"/>
  <path class="arrow" d="M 3838 343 L 3910 343"/>

  <!-- scoring and artifacts -->
  <rect class="node" x="3910" y="502" width="210" height="74"/>
  <text class="label" x="4015" y="532">Official</text>
  <text class="sub" x="4015" y="558">hidden grader</text>

  <rect class="artifact" x="3660" y="620" width="460" height="78"/>
  <text class="label" x="3890" y="650">Artifacts</text>
  <text class="sub" x="3890" y="676">run_manifest + report + scorecard</text>

  <path class="arrow-soft" d="M 4015 380 L 4015 502"/>
  <path class="arrow-soft" d="M 4015 576 C 4015 612 3960 620 3920 620"/>
  <path class="arrow-soft" d="M 4015 380 C 4015 610 3860 620 3820 620"/>

  <!-- loop back -->
  <rect class="dot" x="1604" y="641" width="44" height="34"/>
  <path class="loop" d="M 3622 382 C 3200 682 2200 682 1648 658 C 1570 655 1530 612 1538 444"/>
  <text class="tiny" x="2530" y="704">feedback: normalized logs, latest best candidate, budget view, token audit</text>

  <!-- small status tags -->
  <rect class="dot" x="3328" y="262" width="34" height="34"/>
  <text class="tag" x="3345" y="279">Y</text>
  <rect class="dot" x="3328" y="402" width="34" height="34"/>
  <text class="tag" x="3345" y="419">N</text>
  <rect class="dot" x="3862" y="326" width="34" height="34"/>
  <text class="tag" x="3879" y="343">N</text>

  <!-- notes -->
  <text class="tiny" x="980" y="428">HarnessBackend calls ToolServer only</text>
  <text class="tiny" x="1855" y="214">API key never persisted</text>
  <text class="tiny" x="2210" y="414">reject bad JSON, bad schema, bad top signature</text>
  <text class="tiny" x="3890" y="724">--score persists official Scorecard; report.json normalizes SynthReport PPA fields.</text>
</svg>
