<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="730" viewBox="0 0 1800 730" role="img" aria-labelledby="title desc">
<title id="title">Code-grounded Verified-Candidate Loop</title>
<desc id="desc">Candidate-loop abstraction of the active submission implementation. Public baseline checks precede this loop. The model returns full source; interface validation precedes full-plan budget admission in optimization and structural repair. Ordinary repair is charged per tool. Applicable validity checks precede candidate retention. Metric completeness belongs to optimization scoring, followed by a strict Q_HW improvement comparison. Local diagnostic feedback and history-conditioned retrieval guide proposals. Optimization reuses retained source. Finalization prefers last_verified_kernel and otherwise may emit a failure fallback with status. Optional search guards, competition lanes, and exceptional exits are omitted. See agent_workflow_sources.md for every module, edge, scope limitation, and source reference.</desc>
<metadata>
Module sources, relative to fpt26-agent-v3:
Task: agent/main.py::_run_submission; agent/pipeline/submission.py::run_submission.
Proposal: agent/prompts.py::SYSTEM; agent/agents/repair.py::RepairAgent.run; agent/agents/structural.py::StructuralRepairAgent.run; agent/agents/optimization/controller.py::run_optimization_loop.
Interface: agent/candidate/validator.py::validate_candidate.
Budget: agent/candidate/validator.py::can_afford_validation; optimization/controller.py and structural.py callers. Per-tool charges: ../fpt26-harness/llm4hls/harness.py::ToolServer.
Validity: candidate/validator.py::record_synth_gates, record_cosim_gate, mark_fully_verified; runner.py::ToolServer.
Metrics and comparison: agents/optimization/scoring.py::score_candidate; scoring/scoring_v3.py::grade; optimization/controller.py strict q_hw comparison.
Feedback: agents/optimization/feedback.py; agents/repair.py::_repair_attempt_record; structural.py cosim_log prompt.
RAG: knowledge.py::retrieve_knowledge, format_for_prompt; optimization/controller.py KnowledgeQuery(history=history).
Retained source: optimization/controller.py best, current_kernel=best, state.kernel=best.
Finalize and output: pipeline/submission.py::_finalize; main.py::_run_submission.
</metadata>
