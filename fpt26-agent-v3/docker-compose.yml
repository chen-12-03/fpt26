services:
  agent:
    build:
      context: ${FPT26_REPO_ROOT:-..}
      dockerfile: fpt26-agent-v3/Dockerfile
      args:
        BASE_IMAGE: ${FPT26_AGENT_BASE_IMAGE:-vitis_runtime:2025.2}
    image: ${FPT26_AGENT_V3_IMAGE:-fpt26-agent-v3:latest}
    working_dir: /workspace
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      FPT26_REPO_ROOT: /workspace
      VITIS: ${VITIS:?set VITIS to the host Vitis 2025.2 path}
      XRT: ${XRT:-/opt/xilinx/xrt}
      PLATFORM: ${PLATFORM:-}
      HLS_PART: ${HLS_PART:-xcu55c-fsvh2892-2L-e}
      XILINX_VITIS: ${VITIS:?set VITIS to the host Vitis 2025.2 path}
      XILINX_XRT: ${XILINX_XRT:-/opt/xilinx/xrt}
      XILINX_PLATFORM: ${PLATFORM:-}
      PYTHONPATH: /workspace/fpt26-agent-v2:/workspace/fpt26-harness:/workspace/fpt26-agent-v3
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      USER: ${USER:-fpt26}
      LOGNAME: ${LOGNAME:-fpt26}
      HOME: ${HOME:?set HOME}
      XILINXD_LICENSE_FILE: ${XILINXD_LICENSE_FILE:-}
      LM_LICENSE_FILE: ${LM_LICENSE_FILE:-}
    volumes:
      - type: bind
        source: ${FPT26_REPO_ROOT:?set FPT26_REPO_ROOT}
        target: /workspace
      - type: bind
        source: ${VITIS_MOUNT_ROOT:?set VITIS_MOUNT_ROOT to the host Xilinx install root}
        target: ${VITIS_MOUNT_ROOT:?set VITIS_MOUNT_ROOT to the host Xilinx install root}
        read_only: true
      - type: bind
        source: ${HOME:?set HOME}
        target: ${HOME:?set HOME}
      - type: bind
        source: /etc/passwd
        target: /etc/passwd
        read_only: true
      - type: bind
        source: /etc/group
        target: /etc/group
        read_only: true
